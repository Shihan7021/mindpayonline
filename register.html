<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - MindPay</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 25%, #16213e 50%, #3C0775 75%, #7454AC 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(116, 84, 172, 0.3);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { width: 4px; height: 4px; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 6px; height: 6px; left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { width: 3px; height: 3px; left: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { width: 5px; height: 5px; left: 40%; animation-delay: 3s; }
        .particle:nth-child(5) { width: 4px; height: 4px; left: 50%; animation-delay: 4s; }
        .particle:nth-child(6) { width: 7px; height: 7px; left: 60%; animation-delay: 5s; }
        .particle:nth-child(7) { width: 3px; height: 3px; left: 70%; animation-delay: 0.5s; }
        .particle:nth-child(8) { width: 5px; height: 5px; left: 80%; animation-delay: 1.5s; }
        .particle:nth-child(9) { width: 4px; height: 4px; left: 90%; animation-delay: 2.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* Futuristic grid overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(116, 84, 172, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(116, 84, 172, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
            animation: gridPulse 4s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.1; }
        }

        /* Main container */
        .register-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 0 20px;
        }

        /* Futuristic register card */
        .futuristic-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(116, 84, 172, 0.3);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            animation: cardGlow 3s ease-in-out infinite alternate;
        }

        @keyframes cardGlow {
            0% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(116, 84, 172, 0.3); }
            100% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(116, 84, 172, 0.6); }
        }

        /* Card corner accents */
        .futuristic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 30px;
            height: 30px;
            border-top: 2px solid #7454AC;
            border-left: 2px solid #7454AC;
            border-radius: 20px 0 0 0;
        }

        .futuristic-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 30px;
            height: 30px;
            border-bottom: 2px solid #7454AC;
            border-right: 2px solid #7454AC;
            border-radius: 0 0 20px 0;
        }

        /* Logo styling */
        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .logo-image {
            max-width: 120px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(116, 84, 172, 0.5));
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .app-title {
            font-family: 'Raleway', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(116, 84, 172, 0.8);
            margin-top: 1rem;
            letter-spacing: 2px;
        }

        .register-title {
            font-family: 'Raleway', monospace;
            font-size: 1.5rem;
            font-weight: 400;
            color: #fff;
            text-align: center;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
        }

        .register-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #7454AC, transparent);
        }

        /* Plan badge */
        .plan-badge {
            display: inline-block;
            background: linear-gradient(135deg, #7454AC, #3C0775);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(116, 84, 172, 0.3);
        }

        /* Form styling */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-label {
            font-family: 'Raleway', monospace;
            font-size: 0.9rem;
            color: #7454AC;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .futuristic-input, .futuristic-select {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(116, 84, 172, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Roboto', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .futuristic-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .futuristic-input:focus, .futuristic-select:focus {
            outline: none;
            border-color: #7454AC;
            box-shadow: 
                0 0 0 2px rgba(116, 84, 172, 0.2),
                inset 0 0 20px rgba(116, 84, 172, 0.1);
            background: rgba(255, 255, 255, 0.08);
        }

        .futuristic-select option {
            background: #2c2c2c;
            color: #fff;
        }

        /* Futuristic buttons */
        .futuristic-btn {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #3C0775 0%, #7454AC 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'Raleway', monospace;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .futuristic-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .futuristic-btn:hover::before {
            left: 100%;
        }

        .futuristic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 10px 25px rgba(60, 7, 117, 0.4),
                0 0 20px rgba(116, 84, 172, 0.6);
            color: #fff;
            text-decoration: none;
        }

        .futuristic-btn:active {
            transform: translateY(0);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(116, 84, 172, 0.5);
            color: #7454AC;
        }

        .secondary-btn:hover {
            background: rgba(116, 84, 172, 0.2);
            color: #fff;
            border-color: #7454AC;
        }

        /* Button container */
        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .button-group .futuristic-btn {
            flex: 1;
            margin-bottom: 0;
        }

        /* Loading animation */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            z-index: 100;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(116, 84, 172, 0.3);
            border-top: 3px solid #7454AC;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .futuristic-card {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .app-title {
                font-size: 1.5rem;
            }

            .register-title {
                font-size: 1.2rem;
                letter-spacing: 2px;
            }

            .button-group {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        /* Success/Error messages */
        .message-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 300px;
        }

        .futuristic-alert {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #7454AC;
            border-radius: 12px;
            padding: 1rem;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            margin-bottom: 0.5rem;
            animation: slideInRight 0.3s ease;
        }

        .futuristic-alert.success {
            border-color: #28a745;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.3);
        }

        .futuristic-alert.error {
            border-color: #dc3545;
            box-shadow: 0 0 20px rgba(220, 53, 69, 0.3);
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Plan selection modal styles */
        .plan-selection-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .plan-selection-content {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(116, 84, 172, 0.3);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .plan-option {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(116, 84, 172, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .plan-option:hover {
            background: rgba(116, 84, 172, 0.2);
            border-color: #7454AC;
        }

        .plan-option.selected {
            background: rgba(116, 84, 172, 0.3);
            border-color: #7454AC;
            box-shadow: 0 0 20px rgba(116, 84, 172, 0.4);
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <!-- Grid overlay -->
    <div class="grid-overlay"></div>

    <!-- Message container for alerts -->
    <div class="message-container" id="messageContainer"></div>

    <!-- Plan Selection Modal -->
    <div class="plan-selection-modal" id="planSelectionModal">
        <div class="plan-selection-content">
            <h3 style="color: #fff; margin-bottom: 1.5rem;">Choose Your Plan</h3>
            <p style="color: #ccc; margin-bottom: 2rem;">Select a plan to continue with registration</p>
            
            <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                <div class="plan-option" data-plan="Free">
                    <h4 style="color: #fff; margin-bottom: 1rem;">Free</h4>
                    <p style="color: #ccc; font-size: 0.9rem;">Basic features for personal use</p>
                </div>
                
                <div class="plan-option" data-plan="Pro">
                    <h4 style="color: #fff; margin-bottom: 1rem;">Pro</h4>
                    <p style="color: #ccc; font-size: 0.9rem;">Advanced features and analytics</p>
                </div>
            </div>
            
            <button id="confirmPlanBtn" class="futuristic-btn" style="width: auto; padding: 0.75rem 2rem; margin-bottom: 0.5rem;" disabled>Continue</button>
            <br>
            <button onclick="window.location.href='index.html'" class="secondary-btn" style="width: auto; padding: 0.5rem 1rem; margin-bottom: 0;">Cancel</button>
        </div>
    </div>

    <div class="register-container">
        <div class="futuristic-card">
            <!-- Loading overlay -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-spinner"></div>
            </div>

            <!-- Logo and title -->
            <div class="logo-container">
                <img src="logo-login.png" alt="MindPay Logo" class="logo-image">
                <div class="app-title">MindPay</div>
            </div>

            <!-- Plan badge (will be shown after plan selection) -->
            <div id="planBadge" class="plan-badge" style="display: none;"></div>

            <!-- Register title -->
            <h2 class="register-title">Register</h2>

            <!-- Register form -->
            <form id="registerForm">
                <div class="form-group">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" id="firstName" class="futuristic-input" 
                           placeholder="Enter your first name" required />
                </div>

                <div class="form-group">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" id="lastName" class="futuristic-input" 
                           placeholder="Enter your last name" required />
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="futuristic-input" 
                           placeholder="Enter your email" required />
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="futuristic-input" 
                           placeholder="Create a password" required minlength="6" />
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="futuristic-input" 
                           placeholder="Confirm your password" required />
                </div>

                <div class="form-group">
                    <label for="country" class="form-label">Country</label>
                    <select id="country" class="futuristic-select" required>
                        <option value="">Select your country</option>
                        <option value="Sri Lanka">Sri Lanka</option>
                        <option value="India">India</option>
                        <option value="United States">United States</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="Germany">Germany</option>
                        <option value="France">France</option>
                        <option value="Japan">Japan</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="currency" class="form-label">Currency</label>
                    <select id="currency" class="futuristic-select" required>
                        <option value="">Select your currency</option>
                        <option value="LKR">Sri Lankan Rupee (LKR)</option>
                        <option value="USD">US Dollar (USD)</option>
                        <option value="EUR">Euro (EUR)</option>
                        <option value="GBP">British Pound (GBP)</option>
                        <option value="INR">Indian Rupee (INR)</option>
                        <option value="CAD">Canadian Dollar (CAD)</option>
                        <option value="AUD">Australian Dollar (AUD)</option>
                        <option value="JPY">Japanese Yen (JPY)</option>
                    </select>
                </div>

                <button type="submit" class="futuristic-btn">
                    Create Account
                </button>
            </form>

            <!-- Navigation buttons -->
            <div class="button-group">
                <a href="index.html" class="futuristic-btn secondary-btn">
                    Home
                </a>
                <a href="login.html" class="futuristic-btn secondary-btn">
                    Login
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        // Import Firebase functions
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { auth, db } from "./firebase-config.js";

        let selectedUserType = null;

        // Check URL parameters for user type
        function checkURLParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const userType = urlParams.get('type');
            
            if (userType && (userType === 'Free' || userType === 'Pro')) {
                selectedUserType = userType;
                showPlanBadge(userType);
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            } else {
                // Show plan selection modal if no valid type in URL
                showPlanSelectionModal();
            }
        }

        // Show plan badge
        function showPlanBadge(planType) {
            const badge = document.getElementById('planBadge');
            badge.textContent = `${planType} Plan`;
            badge.style.display = 'block';
        }

        // Show plan selection modal
        function showPlanSelectionModal() {
            const modal = document.getElementById('planSelectionModal');
            modal.style.display = 'flex';
            
            // Add click handlers for plan options
            const planOptions = document.querySelectorAll('.plan-option');
            const confirmBtn = document.getElementById('confirmPlanBtn');
            
            planOptions.forEach(option => {
                option.addEventListener('click', () => {
                    // Remove selected class from all options
                    planOptions.forEach(opt => opt.classList.remove('selected'));
                    // Add selected class to clicked option
                    option.classList.add('selected');
                    // Enable confirm button
                    confirmBtn.disabled = false;
                    // Store selected plan
                    selectedUserType = option.dataset.plan;
                });
            });
            
            confirmBtn.addEventListener('click', () => {
                if (selectedUserType) {
                    modal.style.display = 'none';
                    showPlanBadge(selectedUserType);
                }
            });
        }

        // Show futuristic message
        function showMessage(text, type = 'success') {
            const container = document.getElementById('messageContainer');
            const alert = document.createElement('div');
            alert.className = `futuristic-alert ${type}`;
            alert.textContent = text;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.style.animation = 'slideInRight 0.3s ease reverse';
                setTimeout(() => {
                    if (container.contains(alert)) {
                        container.removeChild(alert);
                    }
                }, 300);
            }, 3000);
        }

        // Show loading state
        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = show ? 'flex' : 'none';
        }

        // Validate password match
        function validatePasswords() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return false;
            }
            return true;
        }

        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", async function (e) {
            e.preventDefault();
            
            if (!selectedUserType) {
                showMessage('Please select a plan first', 'error');
                showPlanSelectionModal();
                return;
            }

            if (!validatePasswords()) {
                return;
            }

            const firstName = document.getElementById("firstName").value.trim();
            const lastName = document.getElementById("lastName").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const country = document.getElementById("country").value;
            const currency = document.getElementById("currency").value;

            showLoading(true);

            try {
                // Create user account
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Save user data to Firestore with user type
                await setDoc(doc(db, "users", user.uid), {
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    country: country,
                    currency: currency,
                    userType: selectedUserType, // Save the user type (Free or Pro)
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    // Default categories
                    selectedIncomeCategories: ["Salary", "Gift", "Bonus", "Interest", "Business Income", "Others"],
                    selectedExpenseCategories: ["Food", "Transport", "Utilities", "Cash Withdraw", "Health", "Loans", "Clothing", "Household", "Savings", "Entertainment", "Others"],
                    customIncomeCategories: [],
                    customExpenseCategories: [],
                    cycleDate: 10 // Default cycle date
                });

                showMessage(`Account created successfully with ${selectedUserType} plan!`, 'success');
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
                
            } catch (error) {
                const errorCode = error.code;
                let errorMessage = "Registration failed. Please try again.";

                if (errorCode === 'auth/email-already-in-use') {
                    errorMessage = "Email address is already registered.";
                } else if (errorCode === 'auth/invalid-email') {
                    errorMessage = "Invalid email address format.";
                } else if (errorCode === 'auth/weak-password') {
                    errorMessage = "Password is too weak. Use at least 6 characters.";
                }

                console.error(error);
                showMessage(errorMessage, 'error');
            } finally {
                showLoading(false);
            }
        });

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            checkURLParams();
        });
    </script>
</body>
</html>
